[package]
name = "put-webd"
version = "0.2.1"
edition = "2021"
description = "Read-only Web monitor for the multi-protocol unified terminal"

[dependencies]
axum = "0.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
