[status]
enabled = true
dir = "/run/put/status"

[can]
enabled = false
ifname = "can0"
# Expected bitrate; configure the SocketCAN interface externally before starting linux_app.
bitrate = 500000
rx_filter_id = 0x320
rx_filter_mask = 0x7FF
extended_id = false
reassembly_timeout_ms = 500

[ethernet]
enabled = true
udp_enabled = true
tcp_enabled = true
bind_addr = "0.0.0.0"
port = 5000

[wifi]
enabled = false
udp_enabled = true
tcp_enabled = true
bind_addr = "0.0.0.0"
port = 5001

[bluetooth]
enabled = false
channel = 1
