[status]
enabled = true
dir = "/run/put/status"

[can]
enabled = true
ifname = "can0"
# Expected bitrate; configure the SocketCAN interface externally before starting linux_app.
bitrate = 500000
tx_can_id = 0x321
rx_filter_id = 0x320
rx_filter_mask = 0x7FF
extended_id = false
reassembly_timeout_ms = 500

[ethernet]
enabled = true
udp_enabled = true
tcp_enabled = true
bind_addr = "0.0.0.0"
port = 5000
tx_peer_addr = ""
tx_peer_port = 5000

[wifi]
enabled = true
udp_enabled = true
tcp_enabled = true
bind_addr = "0.0.0.0"
port = 5001
tx_peer_addr = ""
tx_peer_port = 5001
# Optional CID-specific UDP TX peer mapping: destination CID, IPv4 address, UDP port.
# Port 0 means use tx_peer_port / [wifi].port value from the tx context.
# tx_peer = "0x61000001,192.168.1.50,5001"

[bluetooth]
enabled = true
channel = 1

[4g]
# EC20 USB network interface mode. The OS/driver must bring the cellular
# network up before linux_app starts; linux_app only carries anyMSG over IP.
enabled = false
ifname = "usb0"
bind_to_device = true
udp_enabled = true
tcp_enabled = true
bind_addr = "0.0.0.0"
port = 5002
tx_peer_addr = ""
tx_peer_port = 5002
# Optional CID-specific UDP TX peer mapping: destination CID, IPv4 address, UDP port.
# tx_peer = "0xA1000001,192.168.10.100,5002"

[rs485]
enabled = true
uart_device = "/dev/ttyS4"
baudrate = 115200
rs485_flags = 0x3
