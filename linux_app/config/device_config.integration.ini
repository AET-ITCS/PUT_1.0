[status]
enabled = true
dir = "/run/put/status"

[ipc]
# Keep host until the board DTS reserves a fixed 64 KiB physical region.
# For board bring-up:
#   backend = "devmem"
#   physical_base = 0xXXXXXXXX
#   control_device = "/dev/put_shm_ipc"
# The same address must be used by the RTOS BSP/linker memory map.
backend = "host"
physical_base = 0x0
region_size = 65536
format_on_start = true
control_device = ""

[can]
enabled = true
ifname = "can0"
# Expected bitrate; configure the SocketCAN interface externally before starting linux_app.
bitrate = 500000
tx_can_id = 0x321
rx_filter_id = 0x320
rx_filter_mask = 0x7FF
extended_id = false
reassembly_timeout_ms = 500

[ethernet]
enabled = true
udp_enabled = true
tcp_enabled = true
bind_addr = "0.0.0.0"
port = 5000
tx_peer_addr = ""
tx_peer_port = 5000

[wifi]
enabled = true
udp_enabled = true
tcp_enabled = true
bind_addr = "0.0.0.0"
port = 5001
tx_peer_addr = ""
tx_peer_port = 5001

[bluetooth]
enabled = true
channel = 1

[rs485]
enabled = true
uart_device = "/dev/ttyS4"
baudrate = 115200
rs485_flags = 0x3
